name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests exercise only the app's own modules (stdlib + a stubbed Slack MCP);
      # nothing imports kiro_crew at module scope, so the gateway is not installed.
      - run: python -m pip install --quiet pytest==8.3.3
      - run: python -m py_compile backend/*.py tests/*.py
      - run: python -m pytest tests -q -p no:cacheprovider

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # --legacy-peer-deps: @kirocrew/app-sdk and lucide-react are peers the host
      # provides at runtime; they are not on the public registry.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - name: committed ui/dist matches the source
        run: git diff --exit-code -- dist
